windowing:
  window_seconds: 2.0
  expected_trial_seconds: 8.0
  expected_complete_windows_per_trial: 4
  trial_local: true
  overlap_samples: 0
  cross_trial_windows: forbidden
  incomplete_window_action: reject
  padding: forbidden
  per_study_window_samples:
    study01: 400
    study02: 400
    study03: 400
    study04: 200
    study05: 512

outer_fold_fit:
  learned_weight_training_participants: same_cell_outer_training_stems_only
  learned_weight_training_block: 1
  heldout_stem_excluded_from_learned_weights_and_normalization: true
  heldout_support_block: 1
  heldout_query_block: 2
  support_query_overlap: forbidden
  normalization_scope: same_cell_outer_training_block1_only
  normalization_refit_on_heldout_stem: forbidden
  weak_supervision:
    low_artifact_target_rule: artifactclass_6_fraction_greater_than_or_equal_0.95
    artifact_source_rule: artifactclasses_1_to_5_fraction_greater_than_or_equal_0.25
    same_raw_window_in_both_roles: forbidden
    paired_clean_truth_claim: forbidden
    recontamination_recipe: participant_operator_C_times_aligned_external_EOG_added_to_low_artifact_observed_EEG
    p0_operator_family: instantaneous_FP64_ridge_EOG_to_EEG_then_thin_SVD
    p0_parameter_source: configs/cgdr/sgeyesub_operator_specificity.yaml
    p0_rank: 2
    p0_ridge_lambda: 0.01
    p0_maximum_reference_condition: 10000.0
    p0_minimum_singular_ratio: 0.0001
    p0_minimum_movement_coverage: 0.01
    p0_movement_threshold: 1.0
    p0_bootstrap_replicates: 32
    p0_bootstrap_block_samples: 800
    p0_minimum_bootstrap_success: 0.90
    p0_maximum_bootstrap_median_distance: 0.25
    p0_maximum_bootstrap_q90_distance: 0.50
    p0_fit_samples: full_block1_per_stem
    pairing_order: sorted_targets_cycled_artifact_sources_seed_20260802
    artifact_eog_standardization: source_full_block1_mean_std
  population_projector:
    fit_scope: same_cell_outer_training_stems_block1_only
    heldout_stem_visible: false
  matching_projector:
    fit_scope: heldout_stem_block1_support_only
    heldout_block2_visible: false
  eeg_only_attenuation:
    calibration_scope: same_cell_outer_training_block1_only
    input_at_inference: observed_query_EEG_and_legal_cell_metadata_only
    query_EOG_input: forbidden
    query_artifactclasses_input: forbidden
    query_trial_labels_input: forbidden
    formula: "a=sqrt(1/(1+r^2))"
    r_definition: "norm(Pi*y_t)/outer_training_block1_projected_energy_scale"
    scale_rule: median_finite_positive_framewise_projected_norm_same_cell_outer_training_block1
    scale_floor: 0.000001

information_boundary:
  inference_visible_fields:
    - observed_query_EEG
    - support_derived_matching_projector_or_outer_training_population_projector
    - outer_training_normalization
    - outer_training_calibrated_EEG_only_attenuation
    - legal_study_layout_reference_and_sampling_metadata
  query_evaluation_only_fields:
    - query_external_EOG
    - query_artifactclasses
    - query_trial_labels
    - query_trial_ids_when_present
    - query_outcomes
  query_evaluation_fields_opening: after_all_arm_outputs_for_the_heldout_stem_are_frozen
  query_evaluation_fields_for_fit_selection_or_inference: forbidden

matched_comparison:
  primary_pair: [operator_conditioned_conditional_diffusion_DDIM100, task_matched_multichannel_deterministic_UNet]
  same_information_inputs: true
  same_outer_training_stems: true
  same_weak_supervision_pairs_and_order: true
  same_windowing_channels_normalization_and_operator_conditioning: true
  same_successful_optimizer_updates: 6000
  training_update_budget_matched: true
  inference_compute_budget_matched: false_report_network_calls_latency_and_memory
  batch_size: 8
  learning_rate: 0.0002
  weight_decay: 0.0001
  mixed_precision: true
  seed: 20260802
  early_stopping: forbidden
  checkpoint_selection: fixed_6000_successful_update_endpoint
  model_backbone: masked_multichannel_UNet
  model_width: 64
  report_parameter_count: true
  report_training_updates_walltime_latency_and_peak_memory: true
  deterministic_UNet:
    training_objective: weak_target_valid_time_masked_reconstruction_loss
    inference_network_calls_per_window: 1
  conditional_diffusion:
    training_objective: weak_target_valid_time_masked_epsilon_prediction
    num_diffusion_timesteps: 1000
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    inference_sampler: DDIM
    ddim_network_calls_per_window: 100
    ddim_eta: 0.0
    initial_state_seed: 20260802

reported_arms:
  - raw_observation
  - population_projector_Qy
  - matching_projector_Qy
  - matching_projector_soft_proximal
  - task_matched_multichannel_deterministic_UNet
  - operator_conditioned_conditional_diffusion_DDIM100

restoration:
  matching_projector_soft_proximal_formula: "y-(1-a^2)*Pi*y"
  soft_proximal_uses_query_external_eog: false

evaluation:
  scientific_unit: participant_stem
  compatible_performance_denominator: 43
  availability_denominator: 44
  algorithmic_seeds_are_independent_statistical_units: false
  clean_RRMSE_or_clean_correlation: forbidden_no_clean_target
  metrics:
    - heldout_eog_prediction_remaining_ratio
    - eog_coherence_reduction
    - matching_projector_attenuation_db
    - nonartifact_observation_preservation
    - reference_free_psd_distortion
    - reference_free_covariance_distortion
    - condition_erp_observation_relative_preservation
    - downstream_task_preservation_when_label_semantics_allow
    - observation_change
    - latency_seconds
    - peak_memory_mb
    - failure_status
  metric_contract:
    artifact_mask: samplewise_artifactclasses_1_to_5
    nonartifact_mask: samplewise_artifactclass_6
    heldout_eog_prediction_remaining_ratio: lower_is_better_existing_release_internal_formula
    eog_coherence_reduction: mean_abs_EOG_correlation_observed_minus_output_higher_is_better
    matching_projector_attenuation_db: 20_log10_norm_Py_over_norm_Px_on_artifact_mask_higher_is_better
    nonartifact_observation_preservation: one_minus_relative_output_change_on_nonartifact_mask_higher_is_better
    reference_free_psd_distortion: relative_output_vs_observed_power_distortion_on_nonartifact_mask_lower_is_better
    reference_free_covariance_distortion: relative_Frobenius_output_vs_observed_covariance_distortion_on_nonartifact_mask_lower_is_better
    condition_erp_observation_relative_preservation: one_minus_relative_four_condition_template_change_higher_is_better
    observation_change_ratio: relative_output_minus_observed_norm_descriptive_only
  aggregation:
    require_recording_key_pairing: true
    paired_rows_require_both_primary_arms_success: true
    retain_failed_and_blocked_in_denominator: true
    report_pooled_equal_weight_participant_stems: true
    report_by_study: [study02, study04, study05]
    descriptive_participant_stem_bootstrap_replicates: 20000
    bootstrap_seed: 20260802
    bootstrap_confidence_interval: 0.95
    bootstrap_role: descriptive_not_a_preregistered_significance_test

prospective_exploratory_thresholds:
  comparison_direction: conditional_diffusion_minus_matched_deterministic_UNet
  threshold_scope: pooled_43_compatible_evaluation_stems_equal_participant_weight
  by_study_results_required_but_not_additional_pass_fail_thresholds: true
  minimum_paired_success_fraction: 0.90
  minimum_paired_success_count_of_43: 39
  primary_benefit:
    mean_EOG_coherence_reduction_delta: greater_than_0
    mean_matching_projector_attenuation_db_delta: greater_than_0
    participant_joint_primary_win_definition: both_primary_deltas_greater_than_0_for_the_stem
    minimum_participant_joint_primary_win_fraction: 0.60
  safety:
    minimum_mean_nonartifact_preservation_delta: -0.02
    maximum_mean_PSD_distortion_delta: 0.05
    maximum_mean_covariance_distortion_delta: 0.05
    minimum_mean_ERP_proxy_delta: -0.02
    maximum_conditional_diffusion_failure_fraction_of_43: 0.10
    maximum_conditional_diffusion_failure_count_of_43: 4
  all_conditions_required_for_protocol_scoped_positive: true
  interval_crossing_zero_or_threshold_action: report_descriptive_uncertainty_without_posthoc_rule_change
  outcome_labels:
    pass: natural_SGE_conditional_diffusion_supported_over_matched_UNet_under_frozen_weak_supervision_protocol
    fail: no_detectable_incremental_value_for_tested_SGE_conditional_protocol
    insufficient_coverage_or_mixed_safety: inconclusive
  forbidden_extrapolations:
    - diffusion_is_useless
    - diffusion_sampler_has_no_value
    - EEG_diffusion_is_disproved
    - personalization_failed

execution_plan:
  cpu_validation: one_aggregated_job
  gpu_integration: one_smoke_job_engineering_only
  development_fold_array: 10_tasks_maximum_8_concurrent
  development_aggregate: one_CPU_high_job
  evaluation_fold_array: 15_tasks_maximum_8_concurrent
  evaluation_aggregate: one_CPU_high_job
  checkpoint_resume_required: true
  checkpoint_git_policy: do_not_commit
  development_role: protocol_and_feasibility_diagnostic_without_evaluation_access
  scientific_hyperparameter_change_after_development: requires_new_protocol_version_before_evaluation
  scientific_evaluation_scope: every_valid_block2_window_for_all_43_compatible_stems
  smoke_output_role: engineering_only_not_scientific_evidence

