# Training config (handoff §6). Full-training defaults; the M2 overfit sanity overrides
# batch_size/steps via flags (see scripts/m2_overfit_batch.py).
seed: 42
optimizer: adam
lr: 1.0e-4              # Adam lr (paper)
betas: [0.9, 0.999]
weight_decay: 0.0
embedding_weight_decay: 1.0e-4   # weight decay on subject embeddings only (paper; used M3+)
batch_size: 64         # (paper)
epochs: 100            # (paper)
grad_clip: 1.0         # gradient clipping (assumed)
amp: true              # mixed precision (assumed ok)
lr_schedule: cosine    # cosine annealing to 0 (paper)
log_every: 50

# SADDPM loss weights (handoff §5, [DD-10]).
loss_weights:
  lambda_r: 1.0
  lambda_o: 0.1
  lambda_a: 0.1

wandb:
  enabled: true
  project: saddpm      # default project
  entity: null         # null -> the authenticated default entity
  mode: offline        # offline: records locally, `wandb sync` later (user choice)

# Joint vs per-source-subject training. The 3 SADDPM losses (ArcFace subject-id over N=9,
# orthogonality) are only non-degenerate under joint training, so 'joint' is the default;
# 'per_subject' is kept for ablations. Denoising uses the source embedding e(i) at test time.
train_mode: joint      # joint | per_subject
