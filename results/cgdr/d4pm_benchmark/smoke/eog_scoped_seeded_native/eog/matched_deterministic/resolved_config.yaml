known_upstream_issues:
  artifact_trainer_nameerror: train_d4pm_artifacts.py imports DualBranchDenoisingModel_noise
    but instantiates the undefined name DualBranchDenoisingModel, so the released
    artifact trainer raises NameError
  artifact_architecture_mismatch: the ordinary class uses two attention heads and
    the noise class uses four, while test_joint.py builds the four-head noise architecture
    to load the artifact checkpoint; the adapter therefore trains the four-head noise
    class for the artifact branch and labels that choice minimally_repaired_source-faithful
  prepared_data_path_mismatch: Data_Preparation/data_for_eegdnet.py writes to .data/data_for_*
    without creating those directories while test_joint.py reads ./data/data_for_test
  no_seed: neither the preparation nor either trainer defines a random seed
  model_only_checkpoints: utils.train saves model.state_dict() only, with no optimizer,
    scheduler, epoch, or RNG state, so the released trainer has no deterministic wall-time
    resume
  released_evaluation_is_a_50_row_example: test_joint.py evaluates only the first
    50 EOG rows at each of 11 SNR levels (550 outputs) despite constructing 41,140
    EOG test mixtures
  ecg_not_reproducible: the native loader unconditionally requires ECG_all_epochs.npy,
    which is not in the registered EEGdenoiseNet release and has no documented derivation
    in the D4PM release, so the full three-artifact native protocol cannot be reproduced
    and this benchmark is frozen to the EOG route
  get_rms_returns_mean_square: the helper named get_rms returns mean square rather
    than root mean square and is combined with a square-root SNR amplitude factor;
    the recipe is preserved exactly and disclosed, never physically corrected here
  spectral_rrmse_shape_check: 'checked for the EEGDfus-style 400-vs-512 denominator
    defect and it is ABSENT: test_joint.py takes the 512-bin FFT magnitude of both
    clean and denoised signals, so numerator and denominator shapes agree; the metric
    is reported under the explicit name rrmse_spectral_fft_magnitude because it is
    an FFT-magnitude ratio, not the Welch-PSD RRMSE_s of the EEGdenoiseNet literature,
    and the two are not interchangeable'
  issue_policy: audit_only_never_silently_change_the_scoped_native_recipe
deviations:
  scope_eog_only:
    reason: ECG library absent and undocumented; see known_upstream_issues
    effect: no three-artifact joint training; the class label is constant 0
  artifact_branch_four_head_noise_class:
    reason: closes the released NameError consistently with test_joint.py
    label: minimally_repaired_source-faithful
  seeded_preparation:
    reason: upstream defines no seed; the adapter fixes adapter_seed=20260830
    effect: permutation, pairing, and SNR semantics are preserved but the RNG call
      order is the adapter's own, so exact upstream sample identity is unreproducible
      by construction
  single_process_two_branch_training:
    reason: upstream trains the two branches in two separate scripts with independent
      shuffles; the adapter trains both in one process over one shared shuffled stream
      so a single resumable checkpoint covers both and both branches provably see
      identical pairs
    effect: per-branch loss, optimizer, learning-rate schedule, gradient clipping,
      and optimizer-update count are unchanged; only the batch ordering seen by the
      artifact branch differs from an independent shuffle
  single_adam_over_both_branches:
    reason: one checkpointable optimizer state for the two-branch arm
    effect: numerically identical to two independent Adam+StepLR pairs because Adam
      state is per-parameter and only the branch whose loss was just backpropagated
      holds gradients at its step
  resumable_checkpoints:
    reason: released checkpoints are model-only, so a walltime kill wastes a run
    effect: checkpoints carry both branch weights, optimizer, scheduler, epoch, step,
      and RNG state; no training semantics change
  full_test_evaluation:
    reason: the released evaluation is a 550-output example subset
    effect: all 3,740 frozen EOG test rows are evaluated at all 11 SNR levels; the
      upstream first-50-row subset is retained as a separate labelled diagnostic,
      never as the headline result
  frozen_gradient_accumulation:
    reason: batch 1024 at features 128 may not fit the scheduled GPU
    status: not_enabled_by_default
    effect: if enabled, gradient_accumulation_steps must divide batch_size exactly
      and the optimizer-update count is unchanged; the resolved config records the
      adaptation explicitly
execution:
  mode: d4pm-benchmark
  stages:
