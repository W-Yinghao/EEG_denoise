  - A100
  - H100
  gpu_walltime: '23:59:59'
  gpu_excluded_nodes:
  - node54
  array: 0-1%2
  requeue_expected: the joint arm exceeds one 23:59:59 allocation; SIGUSR1 checkpoint-and-exit-75
    plus repeated full submissions of the same task index are the intended route
  cpu_test_command: scripts/slurm/submit.sh cpu cgdr d4pm-benchmark configs/baselines/d4pm_eog_scoped.yaml
    cpu-tests
  smoke_command: scripts/slurm/submit.sh gpu-any cgdr --array 0-1%2 d4pm-benchmark
    configs/baselines/d4pm_eog_scoped.yaml smoke
  full_command: scripts/slurm/submit.sh gpu-any cgdr --array 0-1%2 d4pm-benchmark
    configs/baselines/d4pm_eog_scoped.yaml full
  resume_command: scripts/slurm/submit.sh gpu-any cgdr --array TASK_INDEX d4pm-benchmark
    configs/baselines/d4pm_eog_scoped.yaml full
  aggregate_command: scripts/slurm/submit.sh cpu cgdr --afterok FULL_ARRAY_JOB_ID
    d4pm-benchmark configs/baselines/d4pm_eog_scoped.yaml aggregate-full
