  cudnn_deterministic: true
protocols:
  eog_scoped_seeded_native:
    label: D4PM_eog_scoped_seeded_native
    result_scope: source_faithful_eog_route_of_the_native_recipe_seeded_and_minimally_repaired
    split:
      train_fraction: 0.8
      remainder_split: equal_halves_validation_then_test
      split_order: independent_permutation_then_drop_clean_to_artifact_count_then_contiguous_80_10_10_then_11x_within_split_mixing
      clean_library_truncated_to_artifact_count: true
      source_epoch_reuse_across_splits: false
      source_epoch_repetitions_within_split: 11
      upstream_seed_defined: false
      adapter_seed: 20260830
      native_issue_policy: preserve_and_report_do_not_repair
    mixture:
      snr_helper: upstream_get_rms_returns_mean_square_not_rms
      snr_amplitude_factor: sqrt_of_ten_to_the_tenth_of_snr_db
      coefficient: mean_square_clean_over_mean_square_artifact_times_snr_amplitude
      per_epoch_standardization: sklearn_preprocessing_scale
      recipe_policy: preserve_exactly_and_disclose_do_not_physically_correct
      train_snr_db: uniform_minus5_to_plus5
      validation_snr_db: uniform_minus5_to_plus5
      test_snr_db_levels: 11
      test_snr_db_range:
      - -5.0
      - 5.0
    training:
      features: 128
      epochs: 4000
      batch_size: 1024
      combinations: 11
      learning_rate: 0.001
      scheduler_step_epochs: 1500
      scheduler_gamma: 0.1
      gradient_clip: 1.0
      gradient_accumulation_steps: 1
      validation_interval_epochs: 10
      checkpoint_interval_epochs: 10
      evaluation_batch_size: 256
      workers: 8
      drop_last: true
      early_stopping: false
      mixed_precision: false
      resume: true
    diffusion:
      schedule: linear
      beta_start: 0.0001
      beta_end: 0.02
      num_steps: 500
    joint_sampler:
      lambda_dc: 0.5
      gamma: 1.0
      eta: 0.3
      observation_model: y_equals_x_plus_gamma_times_h
      shared_posterior_noise_draw_for_both_chains: true
arms:
  joint_dual_diffusion:
    label: D4PM_joint_posterior_sampling_two_branch
    branches:
    - clean_eeg
    - artifact
    clean_branch_architecture: DualBranchDenoisingModel_two_attention_heads
    artifact_branch_architecture: DualBranchDenoisingModel_noise_four_attention_heads
    artifact_branch_repair: minimally_repaired_source-faithful
    sampler: upstream_DDPM_joint_denoising
    network_calls_per_output: 1000
  matched_deterministic:
    label: same_clean_branch_backbone_condition_only_deterministic
    backbone_source: frozen_external_D4PM_DualBranchDenoisingModel
    visible_inputs:
    - noisy_single_channel_epoch
    - artifact_class_label
    paired_data_and_split: exactly_same_as_joint_dual_diffusion
    optimizer_and_schedule: Adam_and_StepLR_matching_the_diffusion_branches
    optimizer_updates: exactly_equal_to_one_paired_diffusion_branch
    target: paired_clean_EEG_component
    loss: L1_sum_matching_official_diffusion_loss_reduction
    stochastic_latent_or_sampling: false
    network_calls_per_output: 1
budget:
  train_pairs: 29920
  validation_pairs: 3740
  evaluation_mixtures_per_snr: 3740
  optimizer_updates_per_epoch: 29
  optimizer_updates_per_branch: 116000
  joint_dual_diffusion_total_updates: 232000
  matched_deterministic_total_updates: 116000
  update_budget_matching: per_branch_epochs_batches_and_updates_are_identical; the
