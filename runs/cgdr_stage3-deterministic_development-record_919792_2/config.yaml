deterministic_model:
  eeg_channels: 19
  signal_length: 512
  base_channels: 64
  channel_mults: [1, 2, 4]
  num_res_blocks: 2
  groupnorm_groups: 8
  dropout: 0.05
  time_sinusoidal_dim: 128
  time_embed_dim: 512
  attention_length: 64
  attention_heads: 4
  residual_output: true

deterministic_training:
  operator_sources: [population_projector, matching_p0, query_derived_oracle_projector]
  oracle_conditioning_scope: training_and_development_source_records_only_nondeployable_upper_bound
  historical_query_clean_target_used_for_training_or_selection: false
  paired_target: clean_EEG_from_same_Klados_training_source_record
  query_clean_target_visible_to_model_input: false
  corruption_exposure: aligned_contaminated_EEG_from_same_training_source_record
  minimum_updates: 3000
  maximum_updates: 6000
  validation_interval_updates: 250
  patience_validations: 8
  batch_size: 32
  learning_rate: 0.0002
  weight_decay: 0.0001
  gradient_clip: 1.0
  mixed_precision: true
  workers: 4
  resume: true
  checkpoint_selection: lowest_development_task_loss_after_minimum_updates

real_record_integration:
  source_record: sim31
  complete_record: true
  operator_sources: [population_projector, matching_p0, query_derived_oracle_projector]
  batch_size: 4
  minimum_minibatches: 2
  checkpoint_role: engineering_only_not_eligible_as_scientific_baseline

task_matched_loss:
  parallel_weight: 1.0
  perpendicular_weight: 1.0
  derivative_weight: 0.1
  selection_target: paired_clean_EEG_development_source_records_only

frozen_comparison:
  freeze_before_development_outcomes: true
  broad_classifier_enabled: false
  methods:
    - M1_observation_warm_start_sdedit
    - M2_final_hard_q_consistency
    - M4_per_step_quadratic_proximal_q_consistency
    - deterministic_Qy
    - deterministic_soft_proximal
    - task_matched_multichannel_deterministic_UNet
  operator_sources:
    - population_projector
    - matching_p0
    - query_derived_oracle_projector
  shared_visible_inputs:
    - observed_query_eeg
    - operator_projector
    - framewise_external_eog_attenuation
    - valid_time_mask
  derived_model_features: [operator_projected_observation, full_projector_entries_broadcast_over_time]
  query_clean_target_use: scoring_only_except_explicit_query_oracle_geometry
  query_outcomes_for_fit_or_selection: forbidden
  attenuation_source: same_support_standardized_framewise_external_EOG
  seeds: [20260801, 20260802, 20260803, 20260804, 20260805]
  seeds_are_statistical_units: false
  output_rule: posterior_mean_across_five_algorithmic_seeds_for_M1_M2_M4
  trust_radius: 0.1
  warm_start_timestep: 250
  soft_proximal_tau: 0.5
  quadratic_proximal_strength: 1.0
  inference_batch_size: 8
  budget:
    M1_network_calls: 100
    M2_network_calls: 100
    M4_network_calls: 100
    UNet_network_calls: 1
    deterministic_algebra_network_calls: 0
    comparison_rule: fixed_per_window_calls_and_report_actual_latency_memory_parameters_training_updates
    compute_is_equal: false
    compute_difference_must_be_reported: true

